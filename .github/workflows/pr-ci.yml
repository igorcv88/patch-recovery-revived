name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell script syntax
        run: |
          bash -n patch-recovery.sh
          bash -n hex-patches.sh
      - name: Whitespace errors
        run: git diff --check
